# Gitleaks configuration for KeyKeyKey
# Prevents accidental commits of secrets, API keys, and credentials.
# Docs: https://github.com/gitleaks/gitleaks

title = "KeyKeyKey Gitleaks Config"

[extend]
# Use the official gitleaks default ruleset as the base
useDefault = true

[[rules]]
id = "generic-master-password"
description = "Potential hardcoded master password"
regex = '''(?i)(master[_-]?pass(word)?|vault[_-]?pass(word)?)\s*[=:]\s*['"][^'"]{8,}['"]'''
tags = ["password", "credential"]

  [rules.allowlist]
  description = "Allow masterPassword field name in source code and test fixtures"
  paths = [
    # Test files contain synthetic passwords (not real secrets)
    '''.*\.test\.tsx?$''',
    '''.*\.spec\.tsx?$''',
    # Design and plan docs contain code examples
    '''docs/superpowers/.*\.md$''',
  ]
  regexes = [
    # TypeScript type annotations, Zod schema fields, optional chaining
    '''masterPassword[?]?:?\s*(z\.string|string|Promise|boolean|await|config\.|undefined|null)''',
    # Property access on config objects (not literal secrets)
    '''config\.masterPassword''',
    # Object property shorthand or trailing comma/brace
    '''masterPassword[,}\s]''',
    # validateMasterPassword function references
    '''validateMasterPassword''',
  ]

[[rules]]
id = "argon2-hash"
description = "Potential Argon2 hash stored in source"
regex = '''\$argon2[id]+\$'''
tags = ["hash", "credential"]

[allowlist]
description = "Global allowlist"
paths = [
  # Extension manifests contain the CWS public key (not a secret)
  '''apps/extension/manifest\.json$''',
  '''apps/extension/manifest\.chrome\.json$''',
  # Test fixtures and test files may contain synthetic test vectors
  '''.*\.test\.ts$''',
  '''.*\.bench\.ts$''',
  '''.*\.spec\.ts$''',
  # Design and plan docs contain code examples with test passwords
  '''docs/superpowers/.*\.md$''',
  # iOS credential provider Swift files reference password concepts in UI code, not actual secrets
  '''apps/mobile/plugins/credential-provider/swift/.*\.swift$''',
  # iOS credential provider target files (copied by @bacons/apple-targets)
  '''apps/mobile/targets/credential-provider/.*\.swift$''',
  # Cross-platform crypto test vectors contain synthetic keys, not real secrets
  '''.*test-vectors\.json$''',
  # Lock files
  '''pnpm-lock\.yaml$''',
  # This config itself
  '''\.gitleaks\.toml$''',
]
