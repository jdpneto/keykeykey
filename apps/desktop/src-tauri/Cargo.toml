[package]
name = "keykeykey-desktop"
version = "0.0.1"
description = "KeyKeyKey Desktop - Cross-platform credential manager"
authors = ["KeyKeyKey Contributors"]
edition = "2021"

[lib]
name = "keykeykey_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3" }
argon2 = "0.5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-mcp-bridge = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
