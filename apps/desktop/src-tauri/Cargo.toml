[package]
name = "keykeykey-desktop"
version = "0.0.1"
description = "KeyKeyKey Desktop - Cross-platform credential manager"
authors = ["KeyKeyKey Contributors"]
edition = "2021"

[lib]
name = "keykeykey_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# keyring 4 split its backends into separate crates. We link keyring-core plus
# only the macOS Keychain store (below) — see keyring_cmds.rs for why Windows
# and Linux deliberately have no default store.
keyring-core = "1"
argon2 = "0.6"
base64 = "0.23"
# rustls with the ring crypto provider (installed in http_client.rs): no
# native-tls/openssl and no aws-lc-sys C build. Server certificates are
# verified by rustls-platform-verifier (the OS trust store).
reqwest = { version = "0.13", features = ["rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2"
objc2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
