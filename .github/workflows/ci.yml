name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Lint, format, and secret scanning
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint, Format & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for org scans; optional for public repos

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: SAST — semgrep static analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Only run on PRs and pushes to main (not on forks to avoid secret exposure)
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: semgrep ci --config p/typescript --config p/secrets --config p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Security audit (osv-scanner) + license compliance
  # ─────────────────────────────────────────────────────────────────────────────
  # Replaced `pnpm audit` with osv-scanner in 2026-04: npm retired the
  # `/-/npm/v1/security/audits/quick` endpoint (HTTP 410) and pnpm <= 10.x
  # still hits it, so every audit run fails at the registry layer. osv-scanner
  # reads pnpm-lock.yaml directly against the OSV database.
  audit:
    name: Security Audit & License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

      - name: License compliance check
        # Fail if any production dependency uses a copyleft or non-permissive license.
        # pnpm licenses list --prod outputs a table; grep for forbidden SPDX identifiers.
        run: |
          FORBIDDEN="GPL-2.0\|GPL-3.0\|LGPL-2.0\|LGPL-2.1\|LGPL-3.0\|AGPL-3.0\|SSPL-1.0\|EUPL-1.1\|EUPL-1.2\|CC-BY-NC"
          RESULT=$(pnpm licenses list --prod 2>&1 || true)
          echo "$RESULT"
          if echo "$RESULT" | grep -qE "$FORBIDDEN"; then
            echo "❌ Forbidden license detected in production dependencies!"
            exit 1
          fi
          echo "✅ All production licenses are permissive."

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Core package — unit tests with 100% crypto coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Test Core Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @keykeykey/core test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: core-coverage
          path: packages/core/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: UI package tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-ui:
    name: Test UI Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @keykeykey/core build
      - run: pnpm --filter @keykeykey/ui test:coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Desktop app tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-desktop:
    name: Test Desktop App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @keykeykey/core --filter @keykeykey/ui build
      - run: pnpm --filter @keykeykey/desktop test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Browser extension tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-extension:
    name: Test Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @keykeykey/core --filter @keykeykey/ui build
      - run: pnpm --filter @keykeykey/extension test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 8: Mobile app tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-mobile:
    name: Test Mobile App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/mobile test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 9: Performance benchmarks (§7.8)
  # Records results as an artifact — does not fail on regressions (yet).
  # ─────────────────────────────────────────────────────────────────────────────
  bench:
    name: Crypto Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run crypto benchmarks
        run: pnpm --filter @keykeykey/core bench --reporter=verbose 2>&1 | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: bench-results.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 10: E2E — Browser Extension (critical tests only — blocking)
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-extension:
    name: E2E Extension (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/core --filter @keykeykey/ui build
      - run: pnpm --filter @keykeykey/extension build
      - run: cd e2e && npm ci && npx playwright install chromium --with-deps
      - run: cd e2e && xvfb-run npx playwright test --project=extension --grep @critical
        env:
          # Secrets for the WebDAV sync-flow spec (tagged @critical). The spec
          # self-skips when any of these are unset, so PRs from forks — which
          # can't read secrets — will just skip the sync tests and still pass
          # the rest of the @critical suite.
          KKK_WEBDAV_URL: ${{ secrets.KKK_WEBDAV_URL }}
          KKK_WEBDAV_USER: ${{ secrets.KKK_WEBDAV_USER }}
          KKK_WEBDAV_PASS: ${{ secrets.KKK_WEBDAV_PASS }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-extension-results
          path: e2e/test-results/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 10.5: E2E — Firefox extension (Selenium + geckodriver against
  # Firefox Developer Edition). Blocking, mirrors the Chromium
  # `@critical` surface (sync-flow has retry: 2 to absorb WebDAV flake).
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-extension-firefox:
    name: E2E Extension Firefox
    runs-on: ubuntu-latest
    env:
      # Pinned Dev Edition URL so cache key is stable. Bump this when you
      # want to roll forward — the `actions/cache` lookup below is keyed on
      # the filename, so a new URL gives a fresh download.
      FIREFOX_DEV_URL: 'https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US'
      FIREFOX_DEV_CACHE_DIR: '/home/runner/.cache/firefox-developer'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/core --filter @keykeykey/ui build
      - run: pnpm --filter @keykeykey/extension build:firefox
      - name: Cache Firefox Developer Edition
        id: cache-firefox-dev
        uses: actions/cache@v4
        with:
          path: ${{ env.FIREFOX_DEV_CACHE_DIR }}
          # Bump this suffix to force a re-download of the Dev Edition
          # tarball (e.g. when Mozilla ships a breaking change).
          key: firefox-dev-edition-linux64-v1
      - name: Download Firefox Developer Edition
        if: steps.cache-firefox-dev.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$FIREFOX_DEV_CACHE_DIR"
          cd "$FIREFOX_DEV_CACHE_DIR"
          curl -sSL -o firefox-dev.tar.xz "$FIREFOX_DEV_URL"
          tar -xf firefox-dev.tar.xz
          rm firefox-dev.tar.xz
      - name: Install Firefox system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libdbus-glib-1-2 libgtk-3-0 libxt6
      - run: cd e2e && npm ci
      - name: Run Firefox Selenium suite
        run: cd e2e && xvfb-run npm run test:firefox
        env:
          # The Selenium harness resolves this path; it matches what
          # `firefoxBinary()` in `e2e/extension-firefox/fixtures/profile.ts`
          # probes for when auto-detecting.
          KKK_FIREFOX_BIN: ${{ env.FIREFOX_DEV_CACHE_DIR }}/firefox/firefox
          # Sync-flow specs self-skip (HAVE_CREDS guard) when these are
          # unset — fork PRs without secret access still pass the rest of
          # the suite.
          KKK_WEBDAV_URL: ${{ secrets.KKK_WEBDAV_URL }}
          KKK_WEBDAV_USER: ${{ secrets.KKK_WEBDAV_USER }}
          KKK_WEBDAV_PASS: ${{ secrets.KKK_WEBDAV_PASS }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-extension-firefox-results
          path: /tmp/kkk-ff-*.*

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 11: Build all packages (gate — runs after all tests pass)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build All
    needs:
      - lint
      - audit
      - test-core
      - test-ui
      - test-desktop
      - test-extension
      - test-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
