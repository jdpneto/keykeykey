name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Lint, format, and secret scanning
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint, Format & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for org scans; optional for public repos

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: SAST — semgrep static analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Only run on PRs and pushes to main (not on forks to avoid secret exposure)
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: semgrep ci --config p/typescript --config p/secrets --config p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Security audit (pnpm audit) + license compliance
  # ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: Security Audit & License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high

      - name: License compliance check
        # Fail if any production dependency uses a copyleft or non-permissive license.
        # pnpm licenses list --prod outputs a table; grep for forbidden SPDX identifiers.
        run: |
          FORBIDDEN="GPL-2.0\|GPL-3.0\|LGPL-2.0\|LGPL-2.1\|LGPL-3.0\|AGPL-3.0\|SSPL-1.0\|EUPL-1.1\|EUPL-1.2\|CC-BY-NC"
          RESULT=$(pnpm licenses list --prod 2>&1 || true)
          echo "$RESULT"
          if echo "$RESULT" | grep -qE "$FORBIDDEN"; then
            echo "❌ Forbidden license detected in production dependencies!"
            exit 1
          fi
          echo "✅ All production licenses are permissive."

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Core package — unit tests with 100% crypto coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Test Core Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @keykeykey/core test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: packages/core/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: UI package tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-ui:
    name: Test UI Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/ui test:coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Desktop app tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-desktop:
    name: Test Desktop App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @keykeykey/core --filter @keykeykey/ui build
      - run: pnpm --filter @keykeykey/desktop test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Browser extension tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-extension:
    name: Test Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/extension test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 8: Mobile app tests
  # ─────────────────────────────────────────────────────────────────────────────
  test-mobile:
    name: Test Mobile App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keykeykey/mobile test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 9: Performance benchmarks (§7.8)
  # Records results as an artifact — does not fail on regressions (yet).
  # ─────────────────────────────────────────────────────────────────────────────
  bench:
    name: Crypto Benchmarks
    runs-on: ubuntu-latest
    # Run on main pushes only — benchmark results are noisy on ephemeral PR runners
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run crypto benchmarks
        run: pnpm --filter @keykeykey/core bench --reporter=verbose 2>&1 | tee bench-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 10: Build all packages (gate — runs after all tests pass)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build All
    needs:
      - lint
      - audit
      - test-core
      - test-ui
      - test-desktop
      - test-extension
      - test-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
