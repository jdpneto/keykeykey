# Provenance gaps, not takeovers (verified 2026-10-03):
# - chokidar@4.0.3: 4.0.0/4.0.1 had SLSA provenance; 4.0.2/4.0.3 (Dec 2024)
#   were published manually by the same maintainer account (paulmillr). Only
#   pulled in by tsup (build tooling).
# - semver@6.3.1: 2023 ReDoS-fix backport on the 6.x line, published manually
#   by the npm CLI maintainers after 7.x had moved to CI/provenance publishing.
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
