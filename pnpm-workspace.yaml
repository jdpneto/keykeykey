packages:
  - packages/*
  - apps/*

onlyBuiltDependencies: esbuild

# Hoist Expo / React Native packages to the root node_modules so Metro and the
# Expo CLI resolve them in the pnpm monorepo (moved here from .npmrc so npm
# stops warning about an unknown project config).
publicHoistPattern:
  - '*expo*'
  - '*react-native*'
  - '@expo/*'

# Supply-chain hardening (enforced by Semgrep in CI):
# - don't resolve versions published less than 7 days ago
minimumReleaseAge: 10080
# - transitive deps may not come from git/tarball/other non-registry sources
blockExoticSubdeps: true
# - refuse an update whose publish-trust evidence (provenance / trusted
#   publishing) is weaker than an earlier version of the same package
trustPolicy: no-downgrade

# Exact versions adopted in the 2026-10-03 dependency refresh (PR #128) that
# were < 7 days old at the time. Already reviewed and tested; pinning by exact
# version keeps the 7-day rule in force for everything else. Safe to delete
# this whole list after 2026-10-10 (everything here will have aged in).
minimumReleaseAgeExclude:
  - '@expo/ui@57.0.21'
  - '@img/sharp-darwin-arm64@0.35.5'
  - '@img/sharp-darwin-x64@0.35.5'
