packages:
  - packages/*
  - apps/*

# Packages allowed to run install scripts (pnpm >= 11; replaces
# onlyBuiltDependencies). Everything else is blocked, and an unlisted package
# with a postinstall fails the install (strictDepBuilds).
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true

patchedDependencies:
  'react-native-argon2@4.0.0': patches/react-native-argon2@4.0.0.patch
  'decode-uri-component@0.2.2': patches/decode-uri-component@0.2.2.patch

overrides:
  '@xmldom/xmldom@<0.8.15': '0.8.15'
  'uuid@<11.1.1': '11.1.1'
  'esbuild@<0.28.1': '^0.28.1'
  'fast-uri@<3.1.9': '3.1.9'

# Hoist Expo / React Native packages to the root node_modules so Metro and the
# Expo CLI resolve them in the pnpm monorepo (moved here from .npmrc so npm
# stops warning about an unknown project config).
publicHoistPattern:
  - '*expo*'
  - '*react-native*'
  - '@expo/*'

# Supply-chain hardening (enforced by Semgrep in CI):
# - don't resolve versions published less than 7 days ago
minimumReleaseAge: 10080
# - transitive deps may not come from git/tarball/other non-registry sources
blockExoticSubdeps: true
# - refuse an update whose publish-trust evidence (provenance / trusted
#   publishing) is weaker than an earlier version of the same package
trustPolicy: no-downgrade

# Exact versions admitted before they reach the 7-day age, each a security fix
# osv-scanner flags on the version it replaces. Remove an entry once it has
# aged in (published date + 7 days).
# - fast-uri@3.1.9 (2026-10-19): GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg,
#   GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h. Safe to delete after 2026-10-27.
minimumReleaseAgeExclude:
  - 'fast-uri@3.1.9'

# Provenance gaps, not takeovers (verified 2026-10-03):
# - chokidar@4.0.3: 4.0.0/4.0.1 had SLSA provenance; 4.0.2/4.0.3 (Dec 2024)
#   were published manually by the same maintainer account (paulmillr). Only
#   pulled in by tsup (build tooling).
# - semver@6.3.1: 2023 ReDoS-fix backport on the 6.x line, published manually
#   by the npm CLI maintainers after 7.x had moved to CI/provenance publishing.
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
