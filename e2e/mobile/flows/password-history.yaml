appId: com.keykeykey.app
tags:
  - critical
---
# §16 — Password history: edit a credential's password twice, then restore
# the older password from the history list. Verify the swap.

- runFlow:
    file: ../helpers/_create-vault.yaml
    env:
      MASTER_PASSWORD: test1234

- runFlow:
    file: ../helpers/_add-login.yaml
    env:
      ITEM_NAME: GitHub
      ITEM_URL: https://github.com
      ITEM_USERNAME: claude-test
      ITEM_PASSWORD: p1

- extendedWaitUntil:
    visible: GitHub
    timeout: 10000

# Open the credential detail.
- tapOn: GitHub

# Tap the edit icon (testID="detail-edit") to push the edit screen.
- tapOn:
    id: detail-edit

# Change password to p2. The password field is secureTextEntry on iOS 26.4,
# so toggle the eye icon first so Maestro can type into it.
- scrollUntilVisible:
    element:
        id: "add-password-toggle"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: add-password-toggle
- tapOn:
    id: add-password
- eraseText
- inputText: p2
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-password
      EDIT_PASSWORD: p2
      TEXT_VAR: EDIT_PASSWORD
- hideKeyboard
- scrollUntilVisible:
    element:
        id: "add-save"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: add-save
# iOS 26+ may show an iCloud "Save Password?" dialog — dismiss it.
- runFlow:
    when:
        visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# After save, router.back() lands on the detail screen (not the list).
# Wait for the detail view to settle by checking the edit icon is back.
- extendedWaitUntil:
    visible:
        id: detail-edit
    timeout: 10000

# Edit again — tap the edit icon from the detail screen.
- tapOn:
    id: detail-edit

# Change password to p3.
- scrollUntilVisible:
    element:
        id: "add-password-toggle"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: add-password-toggle
- tapOn:
    id: add-password
- eraseText
- inputText: p3
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-password
      EDIT_PASSWORD: p3
      TEXT_VAR: EDIT_PASSWORD
- hideKeyboard
- scrollUntilVisible:
    element:
        id: "add-save"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: add-save
- runFlow:
    when:
        visible: "Not Now"
    commands:
      - tapOn: "Not Now"

# Back on the detail screen. Expand the password history section.
- extendedWaitUntil:
    visible:
        id: detail-edit
    timeout: 10000

- tapOn:
    id: detail-password-history

# Two history entries: p1 (originalIndex 0) and p2 (originalIndex 1).
# Reversed display: row 0 = p2 (newest, originalIndex 1), row 1 = p1 (oldest, originalIndex 0).
- assertVisible: 'Password History (2)'

# Tap Restore on the first displayed row (p2 = originalIndex 1).
- tapOn:
    id: history-restore-1

# Alert.alert('Restored', ...) is always fired by the restore handler.
# Hard-wait for the title then dismiss unconditionally.
- extendedWaitUntil:
    visible: 'Restored'
    timeout: 5000
- tapOn: OK

# The restore handler does NOT close the history section, so it remains
# open. Verify new state directly: current password is now p2,
# history contains p1 and p3 — still 2 rows.
- assertVisible: 'Password History (2)'
