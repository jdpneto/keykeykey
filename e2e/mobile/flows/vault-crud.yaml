appId: com.keykeykey.app
tags:
  - critical
---
# §2 — Add a login, card, and secure note; verify all three appear
# in the vault list.

- runFlow:
    file: ../helpers/_create-vault.yaml
    env:
      MASTER_PASSWORD: test1234

- runFlow:
    file: ../helpers/_add-login.yaml
    env:
      ITEM_NAME: GitHub
      ITEM_URL: https://github.com
      ITEM_USERNAME: claude-test
      ITEM_PASSWORD: hunter2-test-password

- runFlow:
    file: ../helpers/_add-card.yaml
    env:
      ITEM_NAME: Test Visa
      ITEM_CARDHOLDER: Claude Tester
      ITEM_CARDNUMBER: '4111111111111111'
      ITEM_MONTH: '12'
      ITEM_YEAR: '2030'
      ITEM_CVV: '123'

- runFlow:
    file: ../helpers/_add-note.yaml
    env:
      ITEM_NAME: WiFi Backup Codes
      ITEM_CONTENT: SSID home-network Key correct horse battery staple

- extendedWaitUntil:
    visible: GitHub
    timeout: 10000
- extendedWaitUntil:
    visible: Test Visa
    timeout: 10000
- extendedWaitUntil:
    visible: WiFi Backup Codes
    timeout: 10000

# Delete a temporary item and verify it is actually removed without changing
# the three base §2 items that later flows expect.
- runFlow:
    file: ../helpers/_add-login.yaml
    env:
      ITEM_NAME: Delete Me
      ITEM_URL: https://delete.example
      ITEM_USERNAME: delete-user
      ITEM_PASSWORD: delete-pass
- extendedWaitUntil:
    visible: Delete Me
    timeout: 10000
- tapOn: Delete Me
- extendedWaitUntil:
    visible:
      id: 'detail-delete'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'detail-delete'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: 'detail-delete'
- extendedWaitUntil:
    visible: 'Delete Item'
    timeout: 10000
- runFlow:
    file: ../helpers/_confirm-delete-alert.yaml
- extendedWaitUntil:
    visible:
      id: 'vault-add-button'
    timeout: 10000
- assertNotVisible: Delete Me
- assertVisible: GitHub
- assertVisible: Test Visa
- assertVisible: WiFi Backup Codes
