appId: com.keykeykey.app
tags:
  - critical
# §9 — CSV import per vendor.
#
# Android fixtures (e2e/fixtures/password-imports/*.csv) are pushed
# to /sdcard/Download by the runner wrapper before `maestro test`
# starts, so the Android document picker can surface them.
#
# Physical iPhone runs use an E2E build with
# EXPO_PUBLIC_E2E_IMPORT_FIXTURE=1 and a fixture pushed into the app
# container at Documents/e2e/fixtures/password-imports/chrome.csv.
# Tapping the picker then loads that fixture directly and skips the
# native iOS Files picker.
#
# §10 (CSV round-trip) and §11 (encrypted backup round-trip) need
# `expo-sharing` → capture-export.js plumbing that's deferred —
# they're not tagged `critical` here yet.
---
- runFlow:
    file: ../helpers/_create-vault.yaml
    env:
      MASTER_PASSWORD: test1234

# Navigate Settings → Import Passwords → From CSV.
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "tab-settings"
# On small screens the Settings list is scrollable and the Import
# Passwords row sits below the initial viewport. Scroll until it's
# visible, then tap. No-op on larger screens.
- scrollUntilVisible:
    element:
        id: "settings-import"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "settings-import"

- extendedWaitUntil:
    visible:
        id: "import-tab-csv"
    timeout: 10000

- runScript:
    file: ../scripts/wda-available.js

# Pick file. On physical iPhone E2E builds this loads the app-container
# fixture directly. On Android it opens the native document picker.
- tapOn:
    id: "import-pick-file"

# Navigate the document picker to the Downloads fixture. The picker
# opens on Recent by default; use the top search field to locate the
# file by name, then tap the RESULT card (the second match — the
# first is the search-bar title also showing "chrome.csv").
#
# The search-field label varies by device: emulators surface a
# "Search" text node, the Pixel's Google Files picker shows "Search
# this device". The regex covers both.
- runFlow:
    when:
      true: ${output.wdaAvailable != true}
    commands:
      - tapOn:
          text: "Search( this device)?"
      - inputText: chrome.csv
      - extendedWaitUntil:
          visible: "chrome.csv"
          timeout: 10000
      - tapOn:
          text: "chrome.csv"
          index: 1

# Wait for source detection.
- extendedWaitUntil:
    visible:
        id: "import-source-badge"
    timeout: 15000
- assertVisible: Chrome

- scrollUntilVisible:
    element:
        id: "import-start"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "import-start"

# Native confirm dialog "Import N credentials?" — tap IMPORT.
- extendedWaitUntil:
    visible: "Import Passwords"
    timeout: 10000
- tapOn:
    text: "^(IMPORT|Import)$"

# Import completes → "Imported N items" banner on the Import screen.
- extendedWaitUntil:
    visible: "Imported 11 items"
    timeout: 30000

# Navigate back to the Settings tab, then switch to Vault to verify a
# representative title landed.
- tapOn:
    id: "import-back"
- extendedWaitUntil:
    visible:
        id: "tab-vault"
    timeout: 10000
- tapOn:
    id: "tab-vault"
- extendedWaitUntil:
    visible: "9gag.com"
    timeout: 10000
