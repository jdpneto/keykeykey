appId: com.keykeykey.app
---
# Create a fresh vault. Starts regardless of current app state:
#   - Setup screen → proceed directly.
#   - Unlock screen (existing vault) → tap Reset Vault first.
#
# Avoids `launchApp: { clearState: true }` because Maestro 2.4.0's
# internal timeout (~30s) is shorter than the Metro bundle download
# on dev builds, which makes clearState flakily fail on cold
# emulators. This helper instead launches, waits for either gate
# screen, and resets the vault if it already exists.
#
# Caller env: MASTER_PASSWORD

- launchApp

# Cold Metro reload can take up to ~180s on a dev build over USB
# (observed Pixel 10 Pro with adb reverse). Poll for either gate
# screen by testID rather than text — the header text flashes in
# before the interactive elements, so text-based waits return
# prematurely and subsequent `tapOn` calls fire against a half-
# rendered tree. `setup-password` / `unlock-reset-link` are only
# rendered once the React tree is actually interactive.
#
# Maestro doesn't support OR across visibility selectors, so use
# two optional waits in sequence. At least one must succeed before
# we proceed; the non-optional wait at the end of this block
# guarantees that.
- extendedWaitUntil:
    visible:
        id: "setup-password"
    timeout: 180000
    optional: true
- extendedWaitUntil:
    visible:
        id: "unlock-reset-link"
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# If the vault already exists, reset it.
- runFlow:
    when:
        visible:
            id: "unlock-reset-link"
    commands:
      - tapOn:
          id: "unlock-reset-link"
      - tapOn:
          id: "unlock-reset-confirm"
      - extendedWaitUntil:
          visible:
              id: "setup-password"
          timeout: 15000

# Final non-optional gate — we must be on the Setup screen by now.
# If neither of the waits above caught the app in an interactive
# state, this fails loudly with a meaningful error instead of the
# confusing "Element not found: setup-password" from the tapOn.
- extendedWaitUntil:
    visible:
        id: "setup-password"
    timeout: 15000
# On small-screen devices (720x1280) the soft keyboard covers the
# second input field AND the submit button, and scrollUntilVisible
# alone doesn't help because the target isn't scrolled — it's
# occluded by the keyboard overlay. Dismiss the keyboard between
# steps so the next field lands back in the visible viewport.
# hideKeyboard is a no-op on screens big enough to show everything
# already, so the sequence is safe across form factors.
- scrollUntilVisible:
    element:
        id: "setup-password"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "setup-password"
- inputText: ${MASTER_PASSWORD}
- tapOn: "Create Your Vault"
- scrollUntilVisible:
    element:
        id: "setup-confirm"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "setup-confirm"
- inputText: ${MASTER_PASSWORD}
- tapOn: "Create Your Vault"
- scrollUntilVisible:
    element:
        id: "setup-submit"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "setup-submit"
# Argon2 + first-run setup. On small / slow emulators the KDF can
# take 30-45s; bump the recovery-screen wait to 60s to cover the
# slow path without being optimistic.
- extendedWaitUntil:
    visible:
        id: "recovery-continue"
    timeout: 60000
- tapOn:
    id: "recovery-continue"

# After the recovery screen the app sometimes surfaces the
# QuickUnlockPrompt ("Speed Up Future Unlocks" / Set Up PIN / Skip
# for Now). Wait for either the vault list or the Skip button so we
# can dismiss the prompt deterministically.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
        visible: "Skip for Now"
    commands:
      - tapOn: "Skip for Now"

- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 10000
