appId: com.keykeykey.app
---
# Add a login item.
# Caller env: ITEM_NAME, ITEM_URL, ITEM_USERNAME, ITEM_PASSWORD

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-login"
# Each field scroll is protective on small screens (720x1280) where
# the keyboard occludes the next field. On larger devices these are
# no-ops when the target is already fully visible.
- scrollUntilVisible:
    element:
        id: "add-name"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- scrollUntilVisible:
    element:
        id: "add-url"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-url"
- inputText: ${ITEM_URL}
- scrollUntilVisible:
    element:
        id: "add-username"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-username"
- inputText: ${ITEM_USERNAME}
- scrollUntilVisible:
    element:
        id: "add-password"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
# iOS 26.4's XCUI stack blocks typing into `secureTextEntry` fields.
# Toggle the eye icon to reveal before typing so Maestro can use
# ordinary UIA key events. Works on Android too (the toggle still
# flips secureTextEntry; Android has no such block but the toggle is
# harmless).
- tapOn:
    id: "add-password-toggle"
- tapOn:
    id: "add-password"
- inputText: ${ITEM_PASSWORD}
# `scrollUntilVisible` returns immediately on iOS 26.4 when the
# target is in the accessibility tree but off-screen due to clipping.
# Plain `- scroll` forces an actual gesture; combined with the
# ScrollView's `keyboardDismissMode="on-drag"` it both scrolls Save
# into view and dismisses the keyboard. Three scrolls is enough for
# any screen size we support; it's idempotent when content is short.
- scroll
- scroll
- scroll
- tapOn:
    id: "add-save"
# iOS 26+ pops a native "Save Password?" dialog (iCloud Keychain
# integration) after the app saves a credential. It obscures the
# vault list from the accessibility tree, so dismiss it before
# asserting. No-op on Android and on older iOS where the prompt
# never appears.
- runFlow:
    when:
        visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 15000
