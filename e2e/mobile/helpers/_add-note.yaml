appId: com.keykeykey.app
---
# Add a secure-note item.
# Caller env: ITEM_NAME, ITEM_CONTENT

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-note"
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- tapOn:
    id: "add-content"
- inputText: ${ITEM_CONTENT}
# Content is a tall multiline input; with the keyboard open, `add-save`
# sits below the fold. Tap the "Add Item" header to blur the input and
# let the keyboard dismiss via RN's auto-blur, then scroll until Save
# is in view. (Using pressKey: BACK here would pop the screen.)
- tapOn: "Add Item"
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
        id: "add-save"
    direction: DOWN
    timeout: 15000
    speed: 40
    visibilityPercentage: 30
- tapOn:
    id: "add-save"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 10000
