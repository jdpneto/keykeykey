appId: com.keykeykey.app
---
# Add a secure-note item.
# Caller env: ITEM_NAME, ITEM_CONTENT

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-note"
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- tapOn:
    id: "add-content"
- inputText: ${ITEM_CONTENT}
# Plain `- scroll` forces an actual gesture; scrollUntilVisible
# returns immediately on iOS 26.4 when the target is accessibility-
# visible but clipped off-screen. Combined with the ScrollView's
# `keyboardDismissMode="on-drag"` this both scrolls Save into view
# and dismisses the keyboard.
- scroll
- scroll
- scroll
- tapOn:
    id: "add-save"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 15000
