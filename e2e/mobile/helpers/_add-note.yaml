appId: com.keykeykey.app
---
# Add a secure-note item.
# Caller env: ITEM_NAME, ITEM_CONTENT

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-note"
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-name
      TEXT_VAR: ITEM_NAME
- tapOn:
    id: "add-content"
- inputText: ${ITEM_CONTENT}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-content
      TEXT_VAR: ITEM_CONTENT
- hideKeyboard
- scrollUntilVisible:
    element:
        id: "add-save"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-save"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 15000
