appId: com.keykeykey.app
---
# Add a card item.
# Caller env: ITEM_NAME, ITEM_CARDHOLDER, ITEM_CARDNUMBER,
#             ITEM_MONTH, ITEM_YEAR, ITEM_CVV

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-card"
# Each field scroll is protective on small screens (720x1280) where
# the keyboard occludes the next field. On larger devices these are
# no-ops when the target is already fully visible.
- scrollUntilVisible:
    element:
        id: "add-name"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-name
      TEXT_VAR: ITEM_NAME
- scrollUntilVisible:
    element:
        id: "add-cardholder"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cardholder"
- inputText: ${ITEM_CARDHOLDER}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-cardholder
      TEXT_VAR: ITEM_CARDHOLDER
      FORCE_SET: "1"
- scrollUntilVisible:
    element:
        id: "add-cardnumber"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cardnumber"
- inputText: ${ITEM_CARDNUMBER}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-cardholder
      TEXT_VAR: ITEM_CARDHOLDER
      FORCE_SET: "1"
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-cardnumber
      TEXT_VAR: ITEM_CARDNUMBER
      FORCE_SET: "1"
# On the Pixel (and any tall-screen real device) the month/year/cvv
# row gets pushed under the soft keyboard after prior fields open it.
# Scroll each target into view before tapping so maestro's selector
# resolves against a visible hierarchy.
- scrollUntilVisible:
    element:
        id: "add-month"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-month"
- inputText: ${ITEM_MONTH}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-cardnumber
      TEXT_VAR: ITEM_CARDNUMBER
      FORCE_SET: "1"
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-month
      TEXT_VAR: ITEM_MONTH
- scrollUntilVisible:
    element:
        id: "add-year"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-year"
- inputText: ${ITEM_YEAR}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-month
      TEXT_VAR: ITEM_MONTH
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-year
      TEXT_VAR: ITEM_YEAR
- scrollUntilVisible:
    element:
        id: "add-cvv"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cvv"
- inputText: ${ITEM_CVV}
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-year
      TEXT_VAR: ITEM_YEAR
- runScript:
    file: ../scripts/wda-set-text.js
    optional: true
    env:
      FIELD_ID: add-cvv
      TEXT_VAR: ITEM_CVV
      FORCE_SET: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
        id: "add-save"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-save"
- runFlow:
    when:
        visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 15000
