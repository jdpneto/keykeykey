appId: com.keykeykey.app
---
# Add a card item.
# Caller env: ITEM_NAME, ITEM_CARDHOLDER, ITEM_CARDNUMBER,
#             ITEM_MONTH, ITEM_YEAR, ITEM_CVV

- tapOn:
    id: "vault-add-button"
- tapOn:
    id: "add-tab-card"
# Each field scroll is protective on small screens (720x1280) where
# the keyboard occludes the next field. On larger devices these are
# no-ops when the target is already fully visible.
- scrollUntilVisible:
    element:
        id: "add-name"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-name"
- inputText: ${ITEM_NAME}
- scrollUntilVisible:
    element:
        id: "add-cardholder"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cardholder"
- inputText: ${ITEM_CARDHOLDER}
- scrollUntilVisible:
    element:
        id: "add-cardnumber"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cardnumber"
- inputText: ${ITEM_CARDNUMBER}
# On the Pixel (and any tall-screen real device) the month/year/cvv
# row gets pushed under the soft keyboard after prior fields open it.
# Scroll each target into view before tapping so maestro's selector
# resolves against a visible hierarchy.
- scrollUntilVisible:
    element:
        id: "add-month"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-month"
- inputText: ${ITEM_MONTH}
- scrollUntilVisible:
    element:
        id: "add-year"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-year"
- inputText: ${ITEM_YEAR}
- scrollUntilVisible:
    element:
        id: "add-cvv"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "add-cvv"
- inputText: ${ITEM_CVV}
# Plain `- scroll` forces an actual gesture; scrollUntilVisible
# returns immediately on iOS 26.4 when the target is accessibility-
# visible but clipped off-screen. Combined with the ScrollView's
# `keyboardDismissMode="on-drag"` this both scrolls Save into view
# and dismisses the keyboard.
- scroll
- scroll
- scroll
- tapOn:
    id: "add-save"
- runFlow:
    when:
        visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
        id: "vault-add-button"
    timeout: 15000
