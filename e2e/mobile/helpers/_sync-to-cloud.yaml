appId: com.keykeykey.app
---
# Navigate from the vault list to Settings → Cloud Sync and complete
# a first-time WebDAV connect. Leaves the vault in the Connected
# state with `sync-status` visible.
#
# Assumes the caller has already created + unlocked a vault (i.e.
# `vault-add-button` is currently visible). If the app was left in
# the Connected state by a prior flow, this helper taps Disconnect
# first so the WebDAV form renders.
#
# Caller env: KKK_WEBDAV_URL, KKK_WEBDAV_USER, KKK_WEBDAV_PASS,
#             MASTER_PASSWORD

- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
        id: "settings-sync"
    timeout: 10000
- tapOn:
    id: "settings-sync"

# Reruns can land us on the Connected card instead of the form.
- runFlow:
    when:
        visible:
            id: "sync-disconnect"
    commands:
      - tapOn:
          id: "sync-disconnect"
      - extendedWaitUntil:
          visible: "Disconnect Sync"
          timeout: 5000
      - tapOn:
          text: "Disconnect"
          index: 1
      - extendedWaitUntil:
          notVisible:
              id: "sync-disconnect"
          timeout: 10000

- extendedWaitUntil:
    visible: WebDAV
    timeout: 10000
- tapOn: WebDAV

- runScript:
    file: ../scripts/wda-available.js

- scrollUntilVisible:
    element:
        id: "sync-webdav-url"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "sync-webdav-url"
- runFlow:
    when:
      true: ${output.wdaAvailable == true}
    commands:
      - runScript:
          file: ../scripts/wda-set-text.js
          env:
            FIELD_ID: sync-webdav-url
            TEXT_VAR: KKK_WEBDAV_URL
- runFlow:
    when:
      true: ${output.wdaAvailable != true}
    commands:
      - inputText: ${KKK_WEBDAV_URL}
- scrollUntilVisible:
    element:
        id: "sync-webdav-username"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "sync-webdav-username"
- runFlow:
    when:
      true: ${output.wdaAvailable == true}
    commands:
      - runScript:
          file: ../scripts/wda-set-text.js
          env:
            FIELD_ID: sync-webdav-username
            TEXT_VAR: KKK_WEBDAV_USER
- runFlow:
    when:
      true: ${output.wdaAvailable != true}
    commands:
      - inputText: ${KKK_WEBDAV_USER}
- runFlow:
    when:
      true: ${output.wdaAvailable == true}
    commands:
      - runScript:
          file: ../scripts/wda-set-text.js
          env:
            FIELD_ID: sync-webdav-password
            TEXT_VAR: KKK_WEBDAV_PASS
- runFlow:
    when:
      true: ${output.wdaAvailable != true}
    commands:
      # Anchored regex — `sync-webdav-password` would otherwise also
      # match the visibility-toggle Pressable. Physical iPhones use the
      # WDA branch above and skip this Maestro selector path entirely.
      - scrollUntilVisible:
          element:
              id: "^sync-webdav-password$"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          id: "^sync-webdav-password$"
      - inputText: ${KKK_WEBDAV_PASS}

- runFlow:
    when:
      true: ${output.wdaAvailable == true}
    commands:
      - runScript:
          file: ../scripts/wda-set-text.js
          env:
            FIELD_ID: sync-master-password
            TEXT_VAR: MASTER_PASSWORD
- runFlow:
    when:
      true: ${output.wdaAvailable != true}
    commands:
      - scrollUntilVisible:
          element:
              id: "^sync-master-password$"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          id: "^sync-master-password$"
      - inputText: ${MASTER_PASSWORD}

- hideKeyboard

- scrollUntilVisible:
    element:
        id: "sync-connect"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: "sync-connect"
